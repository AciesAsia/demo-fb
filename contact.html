<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — NZB Demo Site</title>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary:  #3D5A80;
      --mid:      #98C1D9;
      --light:    #E0FBFC;
      --accent:   #EE6C4D;
      --dark:     #293241;
      --bg:       #edf0f5;
      --white:    #ffffff;
      --text:     #1a2a40;
    }

    body {
      font-family: 'Comfortaa', sans-serif;
      background: var(--white);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--dark);
      padding: 0 28px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    nav { display: flex; gap: 32px; }
    nav a {
      color: var(--light);
      text-decoration: none;
      font-size: 14px;
      transition: color 0.2s;
    }
    nav a:hover { color: var(--white); }

    .logo-sq {
      width: 44px; height: 44px;
      background: #202020;
      border: 1px solid #444;
      border-radius: 2px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      text-decoration: none;
    }
    .logo-sq img { width: 36px; height: 36px; object-fit: contain; }

    .hero {
      background: var(--primary);
      color: var(--white);
      padding: 4rem 2rem 3rem;
      text-align: center;
    }
    .hero h1 {
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      font-weight: 700;
      color: var(--light);
      margin-bottom: 0.5rem;
    }
    .hero p { color: var(--mid); font-size: 0.95rem; }

    .contact-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      padding: 4rem 1rem;
    }

    .contact-card {
      background: var(--white);
      border-top: 4px solid var(--accent);
      border-radius: 10px;
      padding: 2.5rem 2rem;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 2px 12px rgba(0,0,0,0.09);
      text-align: center;
    }

    .contact-icon { font-size: 2.2rem; margin-bottom: 0.75rem; }

    .contact-card h2 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 1.25rem;
    }

    .contact-item {
      border: 1.5px solid var(--mid);
      border-radius: 6px;
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .contact-item a {
      color: var(--primary);
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      transition: color 0.2s;
    }
    .contact-item a:hover { color: var(--text); }

    footer {
      background: var(--dark);
      color: var(--mid);
      text-align: center;
      padding: 0.75rem 1rem;
      font-size: 0.75rem;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>

  <header>
    <nav>
      <a href="index.html">Home</a>
      <a href="fb/index.html">F&amp;B</a>
    </nav>
    <a href="index.html" class="logo-sq">
      <img src="NZB_Logo_001.png" alt="NZB Consulting" />
    </a>
  </header>

  <section class="hero">
    <h1>Contact Me</h1>
    <p>Reach out to NZB Consulting.</p>
  </section>

  <div class="contact-wrap">
    <div class="contact-card">
      <div class="contact-icon">✉️</div>
      <h2>Get in Touch</h2>
      <div class="contact-item">
        <a href="mailto:contact@bito.com.ph">contact@bito.com.ph</a>
      </div>
    </div>
  </div>

  <footer>© 2026 NZB Consulting. All rights reserved.</footer>

</body>
</html>
